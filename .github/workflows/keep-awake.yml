name: Keep production awake

# Render's free plan puts the API to sleep after 15 minutes without outside
# traffic; its own health checks don't count. This calls /health from outside
# during opening hours so the first customer of the day doesn't wait a minute.
on:
  schedule:
    # Every 10 minutes, 02:00-12:50 UTC = 07:30-18:20 in Sri Lanka (UTC+5:30).
    # Scheduled runs use the main branch and can start a few minutes late.
    - cron: "*/10 2-12 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Call the production health check
        env:
          HEALTH_URL: https://eye-care-api-g01u.onrender.com/health
        # A sleeping service takes up to a minute to answer
        run: curl --fail --silent --show-error --retry 3 --retry-delay 15 --max-time 90 "$HEALTH_URL"
